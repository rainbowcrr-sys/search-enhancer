<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Search Enhancer</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "WenQuanYi Micro Hei", sans-serif;
    width: 290px; padding: 14px; margin: 0; color: #0f172a;
    background: #f8fafc;
  }
  h1 {
    font-size: 15px; margin: 0 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, #2563eb, #6366f1);
    color: #fff; font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: -0.5px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 8px; margin-bottom: 6px; font-size: 13px;
  }
  label { cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #2563eb; width: 16px; height: 16px; }
  button.link-btn {
    width: 100%; margin-top: 8px; padding: 9px;
    border: 1px solid #e2e8f0; background: #fff; color: #0f172a;
    border-radius: 8px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  button.link-btn:hover { background: #f1f5f9; }
  button.link-btn svg { width: 18px; height: 18px; fill: #0f172a; }
  .footer {
    margin-top: 10px; font-size: 11px; color: #94a3b8;
    text-align: center; line-height: 1.5;
  }
  .footer a { color: #6366f1; text-decoration: none; }
  .lang { font-size: 11px; color: #94a3b8; margin-left: 4px; }
  .ver {
    font-size: 10px; font-weight: 600; color: #6366f1;
    background: #eef2ff; padding: 2px 6px; border-radius: 4px;
    margin-left: auto;
  }
</style>
</head>
<body>
  <h1><span class="logo">SE</span> Search Enhancer <span class="ver" id="versionBadge">v0.1.2</span></h1>

  <div class="row">
    <label for="highlight">Highlight keywords <span class="lang">/ 高亮</span></label>
    <input type="checkbox" id="highlight" checked />
  </div>
  <div class="row">
    <label for="label">Label result types <span class="lang">/ 标注</span></label>
    <input type="checkbox" id="label" checked />
  </div>
  <div class="row">
    <label for="collapse">Collapse ads <span class="lang">/ 屏蔽广告</span></label>
    <input type="checkbox" id="collapse" checked />
  </div>

  <button class="link-btn" id="openOptions">
    ⚙️ Custom rules <span class="lang">/ 自定义规则</span>
  </button>

  <button class="link-btn" id="openGitHub" title="Open GitHub repo">
    <!-- GitHub icon SVG -->
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    GitHub Repo
  </button>

  <p class="footer">
    by <a href="https://github.com/rainbowcrr-sys" target="_blank" rel="noopener">@rainbowcrr-sys</a>
    &
    <a href="https://github.com/malerror-w" target="_blank" rel="noopener">@malerror-w</a>
  </p>

  <script src="popup.js"></script>
</body>
</html>
