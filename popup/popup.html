<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Search Enhancer</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "WenQuanYi Micro Hei", sans-serif;
    width: 300px; padding: 14px; margin: 0; color: #0f172a;
    background: #f8fafc;
  }
  h1 {
    font-size: 15px; margin: 0 0 10px;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .logo {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, #2563eb, #6366f1);
    color: #fff; font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: -0.5px;
  }
  .ver {
    font-size: 10px; font-weight: 600; color: #6366f1;
    background: #eef2ff; padding: 2px 6px; border-radius: 4px;
    margin-left: auto;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 8px; margin-bottom: 6px; font-size: 13px;
  }
  label { cursor: pointer; user-select: none; }
  input[type=checkbox] { accent-color: #2563eb; width: 16px; height: 16px; }

  /* Dot size slider */
  .slider-row {
    padding: 8px 10px; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 8px; margin-bottom: 6px; font-size: 12px;
  }
  .slider-row .label-line {
    display: flex; justify-content: space-between; margin-bottom: 4px;
  }
  .slider-row input[type=range] { width: 100%; accent-color: #6366f1; }
  .dot-preview {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: #6366f1; vertical-align: middle; margin-left: 6px;
  }

  /* Color pickers */
  .colors-block {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
  }
  .colors-block .cb-title {
    font-weight: 600; margin-bottom: 6px; font-size: 12px; color: #475569;
  }
  .color-row {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  .color-row span { width: 56px; color: #64748b; }
  .color-row input[type=color] {
    width: 28px; height: 22px; border: 1px solid #e2e8f0; border-radius: 4px;
    padding: 0; cursor: pointer; background: none;
  }
  .color-row .swatch {
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid #e2e8f0;
  }

  /* Shortcut hint box */
  .shortcut-hint {
    background: #fefce8; border: 1px solid #fde68a; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 11px; color: #92400e;
    line-height: 1.5;
  }
  .shortcut-hint kbd {
    background: #fff; border: 1px solid #f0d68a; border-radius: 3px;
    padding: 0 5px; font-family: ui-monospace, monospace; font-size: 11px;
    font-weight: 600; color: #78350f;
  }
  .shortcut-hint a { color: #92400e; text-decoration: underline; }

  button.link-btn {
    width: 100%; margin-top: 6px; padding: 9px;
    border: 1px solid #e2e8f0; background: #fff; color: #0f172a;
    border-radius: 8px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  button.link-btn:hover { background: #f1f5f9; }
  button.link-btn svg { width: 18px; height: 18px; fill: #0f172a; }
  .footer {
    margin-top: 10px; font-size: 11px; color: #94a3b8;
    text-align: center; line-height: 1.5;
  }
  .footer a { color: #6366f1; text-decoration: none; }
  .lang { font-size: 11px; color: #94a3b8; margin-left: 4px; }

  /* Pop animation demo */
  .pop-demo {
    display: inline-block;
    background: #fff7c2; color: #3b2f00; font-weight: 600;
    padding: 0 4px; border-radius: 3px;
    box-shadow: inset 0 -1px 0 #fde68a;
    animation: se-pop-demo 1.2s ease-in-out infinite;
  }
  @keyframes se-pop-demo {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
</style>
</head>
<body>
  <h1><span class="logo">SE</span> Search Enhancer <span class="ver" id="versionBadge">v0.1.6</span></h1>

  <!-- Shortcut hint -->
  <div class="shortcut-hint">
    <strong>Quick search:</strong> Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> on any page<br/>
    <span style="font-size:10px;">Backup: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> (if main shortcut conflicts)</span><br/>
    <span style="font-size:10px;">Customize in <a href="chrome://extensions/shortcuts" target="_blank">chrome://extensions/shortcuts</a></span>
  </div>

  <div class="row">
    <label for="highlight">Highlight keywords <span class="lang">/ 高亮</span></label>
    <input type="checkbox" id="highlight" checked />
  </div>

  <div class="row">
    <label for="keywordPop">
      Keyword Pop
      <span class="pop-demo">Aa</span>
      <span class="lang">/ 弹跳突出</span>
    </label>
    <input type="checkbox" id="keywordPop" checked />
  </div>

  <div class="row">
    <label for="label">Label result types <span class="lang">/ 标注</span></label>
    <input type="checkbox" id="label" checked />
  </div>
  <div class="row">
    <label for="collapse">Collapse ads <span class="lang">/ 屏蔽广告</span></label>
    <input type="checkbox" id="collapse" checked />
  </div>

  <!-- Universal Mode toggle -->
  <div class="row" style="border: 1px solid #c7d2fe; background: #eef2ff;">
    <label for="universal" style="display:flex;align-items:center;gap:6px;">
      🌐 Universal Mode
      <span class="lang">/ 全站通用</span>
    </label>
    <input type="checkbox" id="universal" style="accent-color:#6366f1;" />
  </div>

  <!-- Dot size slider -->
  <div class="slider-row">
    <div class="label-line">
      <span>Dot size <span class="lang">/ 圆点大小</span></span>
      <span id="dotSizeVal">8px</span>
    </div>
    <input type="range" id="dotSize" min="4" max="24" step="1" value="8" />
  </div>

  <!-- Color pickers -->
  <div class="colors-block">
    <div class="cb-title">Dot colors <span class="lang">/ 圆点颜色</span></div>
    <div id="colorRows"></div>
    <button id="resetColors" style="margin-top:4px;font-size:11px;padding:3px 8px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer;">Reset to default / 恢复默认</button>
  </div>

  <button class="link-btn" id="openOptions">
    ⚙️ Custom rules <span class="lang">/ 自定义规则</span>
  </button>

  <button class="link-btn" id="openGitHub" title="Open GitHub repo">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    GitHub Repo
  </button>

  <p class="footer">
    by <a href="https://github.com/rainbowcrr-sys" target="_blank" rel="noopener">@rainbowcrr-sys</a>
    &
    <a href="https://github.com/malerror-w" target="_blank" rel="noopener">@malerror-w</a>
  </p>

  <script src="popup.js"></script>
</body>
</html>
