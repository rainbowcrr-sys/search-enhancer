name: Nightly Build

on:
  schedule:
    # 北京时间每天 00:00 = UTC 16:00
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 1. 读 manifest 版本号
      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 manifest version = $VERSION"

      # 2. 检查今天是否已为同版本打过包（用日期去重）
      - name: Check today's build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TODAY=$(date -u +%Y%m%d)          # UTC 日期
          TAG="v${VERSION}-nightly.${TODAY}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 查今天这个 tag 是否已存在
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  $TAG 已存在，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🚀  $TAG 不存在，准备打包"
          fi

      # 3. 打包（仅当今天未打包时）
      - name: Package extension
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TODAY=$(date -u +%Y%m%d)
          ZIP="edge-extension-v${VERSION}-nightly.${TODAY}.zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "📁 打包内容："
          echo "  manifest.json _locales/ content/ icons/ options/ popup/ README.md"

          zip -r "$ZIP" \
            manifest.json \
            _locales \
            content \
            icons \
            options \
            popup \
            README.md \
            --exclude "*.git*" "*.DS_Store" ".gitignore"

          echo "✅ 完成: $ZIP ($(du -h "$ZIP" | cut -f1))"

      # 4. 发 Release
      - name: Create Nightly Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: v${{ steps.ver.outputs.version }}-nightly.${{ github.run_number }}
          body: |
            🌙 **Nightly Build** — `${{ steps.check.outputs.tag }}`

            > 自动构建于 ${{ github.run_started_at }} (UTC)
            > manifest.json 版本：`${{ steps.ver.outputs.version }}`

            **包含文件：**
            - manifest.json
            - _locales/  content/  icons/  options/  popup/
            - README.md

            ⚠️ 自动快照，可能不稳定，仅供测试。
          prerelease: true
          files: ${{ env.ZIP }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. 已存在时提示
      - name: Already built today
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "✅ 今天已为 v${{ steps.ver.outputs.version }} 打过 nightly"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ steps.check.outputs.tag }}"
