<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Search Enhancer - Custom Rules</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "WenQuanYi Micro Hei", sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #0f172a; }
  h1 { font-size: 18px; }
  h2 { font-size: 14px; color: #475569; margin-top: 24px; }
  .desc { font-size: 13px; color: #64748b; }
  textarea { width: 100%; min-height: 100px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px; box-sizing: border-box; }
  button { padding: 8px 14px; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: #1d4ed8; }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  .row > div { flex: 1; }
  .footer { margin-top: 32px; font-size: 12px; color: #94a3b8; }
  a { color: #2563eb; }
</style>
</head>
<body>
  <h1 data-i18n="extName">Search Enhancer <span id="versionBadge" style="font-size:12px;font-weight:600;color:#6366f1;background:#eef2ff;padding:2px 6px;border-radius:4px;margin-left:8px;"></span></h1>
  <p class="desc" data-i18n="extDescription">
    Add your own CSS selectors (one per line) to catch ads that the built-in rules miss.
    You can also add keywords (case-insensitive) that, if found in a result's text, mark it as an ad.
  </p>

  <h2 data-i18n="selectorsTitle">Custom ad selectors</h2>
  <div class="row">
    <div><textarea id="selectors" placeholder=".my-ad-class&#10;#sponsor-block&#10;div[data-track='ad']"></textarea></div>
  </div>

  <h2 data-i18n="keywordsTitle">Custom ad keywords</h2>
  <div class="row">
    <div><textarea id="keywords" placeholder="sponsored&#10;promoted post"></textarea></div>
  </div>

  <button id="save" data-i18n="save">Save</button>
  <span id="status" style="margin-left:10px;font-size:12px;color:#16a34a"></span>

  <p class="footer">
    Maintained by
    <a href="https://github.com/rainbowcrr-sys" target="_blank" rel="noopener">@rainbowcrr-sys</a>
    and
    <a href="https://github.com/malerror-w" target="_blank" rel="noopener">@malerror-w</a>.
  </p>

  <script src="options.js"></script>
</body>
</html>
